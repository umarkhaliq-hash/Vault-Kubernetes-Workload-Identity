apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '18'
    vault.hashicorp.com/agent-inject-vault-addr: http://vault-raft.default.svc:8200
  labels:
    app: payment-app
  name: payment-app
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: payment-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-inject-secret-db: secret/data/production/billing/db-credentials
        vault.hashicorp.com/agent-inject-secret-shipping: secret/data/production/shipping/carrier-token
        vault.hashicorp.com/agent-inject-secret-stripe: secret/data/production/payments/stripe-token
        vault.hashicorp.com/agent-inject-template-db: '{{- with secret "secret/data/production/billing/db-credentials"
          -}}

          DB_USER="{{ .Data.data.username }}"

          DB_PASS="{{ .Data.data.password }}"

          {{- end -}}

          '
        vault.hashicorp.com/agent-inject-template-shipping: '{{- with secret "secret/data/production/shipping/carrier-token"
          -}}

          SHIPPING_KEY="{{ .Data.data.api_key }}"

          WEBHOOK_SECRET="{{ .Data.data.webhook_secret }}"

          {{- end -}}

          '
        vault.hashicorp.com/agent-inject-template-stripe: '{{- with secret "secret/data/production/payments/stripe-token"
          -}}

          STRIPE_SECRET="{{ .Data.data.stripe_secret_key }}"

          {{- end -}}

          '
        vault.hashicorp.com/role: payment-app-role
        vault.hashicorp.com/service: http://vault-raft.default.svc:8200
      labels:
        app: payment-app
    spec:
      containers:
      - command:
        - sh
        - -c
        - while true; do echo Payment-app-running; sleep 15; done
        image: alpine:latest
        imagePullPolicy: Always
        name: alpine-app
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: payment-sa
      serviceAccountName: payment-sa
      terminationGracePeriodSeconds: 30
