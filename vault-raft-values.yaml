injector:
  enabled: true

server:
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true
      listener "tcp" {
        address = "0.0.0.0:8200"
        tls_disable = 1
      }
      storage "raft" {
        path = "/vault/data"
        node_id = "vault-raft-0"
      }
  dataStorage:
    enabled: false
  volumes:
    - name: raft-data
      persistentVolumeClaim:
        claimName: vault-raft-data
  volumeMounts:
    - name: raft-data
      mountPath: /vault/data
