injector:
  enabled: true
server:
  dataStorage:
    enabled: false
  dev:
    enabled: false
  standalone:
    config: |
      ui = true
      disable_mlock = true
      listener "tcp" {
        address = "0.0.0.0:8200"
        tls_disable = 1
      }
      storage "raft" {
        path = "/vault/data"
        node_id = "vault-raft-0"
      }
    enabled: true
  volumeMounts:
  - mountPath: /vault/data
    name: raft-data
  volumes:
  - name: raft-data
    persistentVolumeClaim:
      claimName: vault-raft-data
